# Prévisualisation TEST de BOYGAMES sur Cloudflare Pages (projet distinct « boygames-preview », adresse gratuite pages.dev).
# Indépendant de DJ Académie : secrets propres à BOYGAMES, environnement GitHub « boygames-preview ».
# Ne se déclenche JAMAIS sur main : uniquement sur les branches preview/** ou à la main.
# Supabase TEST seulement (le script de préparation refuse toute référence à la production).
# Le déploiement n'a lieu que si la variable PREVIEW_ACCESS_CONFIRMED vaut "true" (Cloudflare Access en place).
name: Prévisualisation TEST
on:
  push:
    branches: ["preview/**"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: previsualisation-test
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Tests du serveur de duels et de la logique Space
        run: |
          cd server && for f in test/*.test.mjs; do node "$f"; done
          cd .. && node tests/logique/space.test.mjs
      - name: Assemblage du site TEST
        run: sh cloudflare/preparer-previsualisation.sh
      - name: Contrôles de sécurité de la prévisualisation
        run: node tests/preview/verifier-previsualisation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist-preview
          retention-days: 3
  deploiement:
    needs: tests
    if: vars.PREVIEW_ACCESS_CONFIRMED == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: boygames-preview
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-preview
          path: dist-preview
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Déploiement sur Cloudflare Pages (branche de test, jamais la production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BOYGAMES_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BOYGAMES_CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist-preview --project-name boygames-preview --branch preview --commit-dirty=true
      - name: Vérification que l'accès est protégé
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://preview.boygames-preview.pages.dev/)
          echo "Réponse sans authentification : $code"
          if [ "$code" = "200" ]; then echo "ALERTE : prévisualisation ouverte au public"; exit 1; fi
