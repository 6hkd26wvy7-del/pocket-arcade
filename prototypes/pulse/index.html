<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PULSE — prototype BOYGAMES</title>
<style>
  :root { --nuit:#0B0A1F; --cabine:#17142F; --trait:#352E66; --volt:#8B5CF6; --signal:#22D3EE; --corail:#FF5A7A; --mandarine:#FF9F1C; --texte:#F5F3FF; --gris:#A5A0C8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { margin:0; height:100%; background:var(--nuit); color:var(--texte); font-family:"Rubik",system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #hud { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; font-weight:800; font-size:18px; }
  #hud small { display:block; color:var(--gris); font-weight:600; font-size:11px; letter-spacing:.08em; }
  #lives span { display:inline-block; width:14px; height:14px; margin-left:6px; border-radius:50%; background:var(--corail); box-shadow:0 0 8px var(--corail); }
  #lives span.off { background:var(--trait); box-shadow:none; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #energy { display:flex; gap:8px; justify-content:center; padding:10px 0 16px; }
  #energy i { width:46px; height:10px; border-radius:6px; background:var(--cabine); border:1px solid var(--trait); overflow:hidden; }
  #energy i b { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--signal),var(--volt)); }
  #panel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; background:rgba(11,10,31,.82); }
  #panel[hidden] { display:none; }
  h1 { margin:0 0 6px; font-size:44px; font-weight:900; font-style:italic; letter-spacing:.04em; background:linear-gradient(90deg,var(--signal),var(--volt)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:6px 0; color:var(--gris); font-size:15px; max-width:300px; line-height:1.4; }
  .legend { display:flex; gap:14px; margin:12px 0 4px; font-size:13px; color:var(--texte); }
  .legend b { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  button { margin-top:18px; padding:14px 38px; border:0; border-radius:999px; font:inherit; font-weight:900; font-size:18px; color:#fff; background:linear-gradient(#FF9F1C,#F97316); box-shadow:0 6px 0 #B45309,0 0 18px rgba(249,115,22,.4); }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #B45309; }
  .note { margin-top:18px; font-size:11px; color:var(--gris); opacity:.8; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><div><small>SCORE</small><span id="score">0</span></div><div><small>MEILLEUR</small><span id="best">0</span></div><div id="lives"></div></div>
  <div id="stage"><canvas id="c"></canvas>
    <div id="panel">
      <h1>PULSE</h1>
      <p id="msg">Protège le noyau. Touche l'écran pour lancer une onde : elle détruit tout ce qu'elle traverse.</p>
      <div class="legend"><span><b style="background:#22D3EE"></b>1 onde</span><span><b style="background:#8B5CF6"></b>2 ondes</span><span><b style="background:#FF5A7A"></b>à éviter</span></div>
      <p>Plusieurs orbes dans la même onde = combo.</p>
      <button id="go">JOUER</button>
      <div class="note">Prototype d'essai · aucun score envoyé, aucune récompense</div>
    </div>
  </div>
  <div id="energy"><i><b></b></i><i><b></b></i><i><b></b></i></div>
</div>
<script src="pulse-logic.js"></script>
<script>
(function () {
  var P = window.PULSE, cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var panel = document.getElementById("panel"), msg = document.getElementById("msg"), scoreEl = document.getElementById("score"), bestEl = document.getElementById("best"), livesEl = document.getElementById("lives");
  var bars = [].slice.call(document.querySelectorAll("#energy b"));
  var g = null, best = 0, last = 0, w = 0, h = 0, scale = 1, flash = 0, shake = 0, parts = [];
  try { best = +localStorage.getItem("pulse_best") || 0; } catch (e) { }
  bestEl.textContent = best;
  function resize() { var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; w = r.width; h = r.height; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); scale = Math.min(w, h) / (2 * P.R + 40); }
  window.addEventListener("resize", resize); resize();
  function start() { g = P.newGame((Math.random() * 4294967296) >>> 0); parts = []; panel.hidden = true; last = performance.now(); drawLives(); }
  function drawLives() { var s = ""; for (var i = 0; i < P.LIVES; i++) s += '<span class="' + (i < g.lives ? "" : "off") + '"></span>'; livesEl.innerHTML = s; }
  function burst(x, y, col, n) { for (var i = 0; i < n; i++) { var a = Math.random() * 6.283, v = 40 + Math.random() * 110; parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .5, col: col }); } }
  function tap(e) { if (e) e.preventDefault(); if (!g || g.over || !panel.hidden) return; if (P.pulse(g) && navigator.vibrate) { try { navigator.vibrate(8); } catch (x) { } } }
  cv.addEventListener("pointerdown", tap);
  document.getElementById("go").addEventListener("click", start);
  function pos(o) { return [w / 2 + Math.cos(o.ang) * o.d * scale, h / 2 + Math.sin(o.ang) * o.d * scale]; }
  var COL = { std: "#22D3EE", tough: "#8B5CF6", bomb: "#FF5A7A" };
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (g && !g.over && panel.hidden) {
      var before = g.lives; P.step(g, dt);
      g.events.forEach(function (ev) { if (ev === "life" || ev === "bomb") { shake = .25; flash = .3; } });
      if (g.lives !== before) drawLives();
      scoreEl.textContent = g.score;
      if (g.over) { if (g.score > best) { best = g.score; try { localStorage.setItem("pulse_best", best); } catch (e) { } } bestEl.textContent = best; msg.textContent = "Partie terminée : " + g.score + " points" + (g.score >= best && g.score > 0 ? " (record !)" : "") + "."; panel.hidden = false; }
    }
    ctx.clearRect(0, 0, w, h);
    var sx = shake > 0 ? (Math.random() - .5) * 8 * shake * 4 : 0, sy = shake > 0 ? (Math.random() - .5) * 8 * shake * 4 : 0; shake = Math.max(0, shake - dt);
    ctx.save(); ctx.translate(sx, sy);
    var cx = w / 2, cy = h / 2;
    var bg = ctx.createRadialGradient(cx, cy, 10, cx, cy, P.R * scale); bg.addColorStop(0, "#221D44"); bg.addColorStop(1, "#0B0A1F"); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, P.R * scale, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#352E66"; ctx.lineWidth = 2; ctx.stroke();
    if (g) {
      g.waves.forEach(function (wv) { ctx.strokeStyle = "rgba(34,211,238," + (1 - wv.r / P.R * .8) + ")"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, wv.r * scale, 0, 6.283); ctx.stroke(); });
      g.orbs.forEach(function (o) {
        var p = pos(o), r = (o.kind === "tough" ? 15 : 12) * scale * 1.6; ctx.fillStyle = COL[o.kind]; ctx.shadowColor = COL[o.kind]; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(p[0], p[1], o.kind === "tough" && o.hp === 1 ? r * .7 : r, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
        if (o.kind === "bomb") { ctx.strokeStyle = "#0B0A1F"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p[0] - r * .45, p[1] - r * .45); ctx.lineTo(p[0] + r * .45, p[1] + r * .45); ctx.moveTo(p[0] + r * .45, p[1] - r * .45); ctx.lineTo(p[0] - r * .45, p[1] + r * .45); ctx.stroke(); }
      });
      g.events.forEach(function (ev) { if (ev === "pop") burst(cx, cy, "#22D3EE", 0); });
    }
    ctx.fillStyle = "#F5F3FF"; ctx.shadowColor = "#22D3EE"; ctx.shadowBlur = 24; ctx.beginPath(); ctx.arc(cx, cy, P.CORE * scale * (g ? 1 : 1), 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
    parts = parts.filter(function (q) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.life <= 0) return false; ctx.globalAlpha = q.life * 2; ctx.fillStyle = q.col; ctx.fillRect(q.x, q.y, 4, 4); ctx.globalAlpha = 1; return true; });
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = "rgba(255,90,122," + flash + ")"; ctx.fillRect(0, 0, w, h); flash = Math.max(0, flash - dt); }
    var e = g ? g.energy : P.ENERGY_MAX; bars.forEach(function (b, i) { b.style.width = Math.max(0, Math.min(1, e - i)) * 100 + "%"; });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
